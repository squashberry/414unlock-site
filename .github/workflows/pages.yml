name: Validate 414Unlock Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-414unlock
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
      - name: Syntax-check website and Worker JavaScript
        run: |
          node --check account.js
          node --check verify.js
          node --check payment.js
          node --check review.js
          node --check worker/src/index.js
      - name: Confirm payment assets exist
        run: |
          test -s payment.html
          test -s payment.css
          test -s payment.js
          test -s worker/migrations/0002_payments.sql
