name = "414unlock-auth-api"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
SITE_ORIGIN = "https://squashberry.github.io"
TERMS_VERSION = "2026-10-30"

[[d1_databases]]
binding = "DB"
database_name = "414unlock-auth"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Set secrets with wrangler secret put, never in this file:
# CLOUDINARY_CLOUD_NAME     - Cloudinary product environment cloud name
# CLOUDINARY_API_KEY        - Cloudinary API key
# CLOUDINARY_API_SECRET    - Cloudinary API secret; server-side only
# JWT_SECRET                 - at least 32 random bytes
# ADMIN_EMAILS               - comma-separated review-admin email addresses
# DEVICE_DATA_ENCRYPTION_KEY - long random secret (32+ chars) used for AES-GCM device identifier encryption
# HICELLTEK_API_KEY          - HiCellTek IMEI/TAC lookup API key; server-side only
# Payment verification integration; set only after confirming SquashberryPay's actual API contract:
# wrangler secret put SQUASHBERRYPAY_VERIFY_URL
# wrangler secret put SQUASHBERRYPAY_API_KEY
