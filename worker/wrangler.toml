name = "414unlock-auth-api"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
SITE_ORIGIN = "https://squashberry.github.io"
TERMS_VERSION = "2026-10-21"

[[d1_databases]]
binding = "DB"
database_name = "414unlock-auth"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "414unlock-private-documents"

# Set the following with wrangler secret put, never in this file:
# JWT_SECRET       - at least 32 random bytes
# RESEND_API_KEY   - transactional email API key
# FROM_EMAIL       - verified sender identity in your email provider
# ADMIN_EMAILS     - comma-separated review-admin email addresses